<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none">
  <style>
    .trace{stroke-dasharray:22 12;animation:circuitFlow 9s linear infinite}
    .nodes circle{transform-box:fill-box;transform-origin:center;animation:nodePulse 3s ease-in-out infinite}
    .nodes circle:nth-child(2n){animation-delay:-1s}.nodes circle:nth-child(3n){animation-delay:-2s}
    .locks{animation:lockGlow 4s ease-in-out infinite}
    @keyframes circuitFlow{to{stroke-dashoffset:-170}}
    @keyframes nodePulse{0%,100%{opacity:.38;transform:scale(.72)}50%{opacity:.9;transform:scale(1.16)}}
    @keyframes lockGlow{0%,100%{opacity:.5}50%{opacity:.82}}
    @media (prefers-reduced-motion:reduce){.trace,.nodes circle,.locks{animation:none}}
  </style>
